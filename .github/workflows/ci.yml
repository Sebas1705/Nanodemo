name: CI

# Compila y corre los tests unitarios en cada push a main y en cada pull request. Existe aparte de
# release-apk.yml porque ese solo corre al empujar un tag: sin esto, un error de compilación se vería
# recién al publicar una versión. No usa Doppler ni ningún secreto — las keys de los tiers son opcionales
# en el build (ver `secret()` en build.gradle.kts: si faltan quedan vacías), así que también funciona
# en PRs de forks. El APK firmado de verdad lo arma release-apk.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior, que ya quedó desactualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses where the build runs: this PC (self-hosted runner, see Sebas1705/ci-runner) when its heartbeat
  # variable is under 3 minutes old, otherwise a GitHub-hosted runner. Only push and workflow_dispatch can
  # use the PC; pull requests (including forks) always stay on GitHub-hosted runners.
  pick-runner:
    name: Pick the runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          HEARTBEAT: ${{ vars.PC_RUNNER_HEARTBEAT }}
          EVENT: ${{ github.event_name }}
        run: |
          runner='"ubuntu-latest"'
          if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ -n "${HEARTBEAT:-}" ]; then
            age=$(( $(date +%s) - HEARTBEAT ))
            if [ "$age" -ge 0 ] && [ "$age" -lt 180 ]; then runner='["self-hosted","pc"]'; fi
          fi
          echo "Runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # gradlew se commiteó sin el bit de ejecución (se creó desde Windows).
      - name: Compilar y correr los tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug testDebugUnitTest --continue "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - name: Subir los reportes de tests si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/testDebugUnitTest"
          retention-days: 7
